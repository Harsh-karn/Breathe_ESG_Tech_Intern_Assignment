services:
  - type: web
    name: breathe-esg-ingestion
    env: docker
    plan: free
    dockerCommand: "python manage.py migrate && python manage.py shell -c \"from ingestion.models import Tenant; Tenant.objects.get_or_create(name='Acme Corp')\" && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
